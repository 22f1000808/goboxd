http_addr: ":8080"
max_concurrent_jobs: 0                 # 0 -> runtime.NumCPU()
max_queue_depth: 0                     # 0 = unbounded (spec default)
drain_timeout_s: 45
readyz_cache_ttl_s: 30
max_source_bytes: 262144               # 256 KiB
max_stdin_bytes: 65536                 # 64 KiB per test
max_tests: 50
jail_root_dir: /var/lib/goboxd/jails
nsjail_binary: /usr/local/bin/nsjail
cgroupv2_mount: /sys/fs/cgroup
